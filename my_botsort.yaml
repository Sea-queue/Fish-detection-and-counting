# Custom BoT-SORT tracker config for fish counting
# Based on ultralytics default botsort.yaml with track_buffer increased
# to match REID_MAX_GAP (90 frames) for track stitching compatibility.

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 90          # increased from default 30 to support stitching
match_thresh: 0.8
fuse_score: True

# BoT-SORT specifics
gmc_method: sparseOptFlow

# ReID model related thresh
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
